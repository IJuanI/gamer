steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - 'gcr.io/unity-dummy/gamer-hub-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/unity-dummy/gamer-hub-api:latest'

images:
  - 'gcr.io/unity-dummy/gamer-hub-api:latest'

options:
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
