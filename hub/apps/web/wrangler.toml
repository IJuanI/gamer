name = "gamer-hub"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Wraps .open-next/worker.js (generated by `pages:build`): routes /api/* to the
# @gamer/api Hono app, everything else falls through to the Next.js handler.
main = "worker-entry.ts"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = ["/*", "!/_next/*", "!/**/*.png", "!/**/*.svg", "!/**/*.ico", "!/**/*.jpg", "!/**/*.jpeg", "!/**/*.webp", "!/**/*.gif"]

[[routes]]
pattern = "gameer.com.ar/*"
zone_id = "3da753fd4dce5b24bd2aa3efeaf5bfdf"

[[routes]]
pattern = "paranagamejam.com.ar/*"
zone_id = "7add1ceab6c4ce00f4f30ff69c470896"

[vars]
NODE_ENV = "production"
WEB_ORIGIN = "https://gameer.com.ar,https://paranagamejam.com.ar"
OAUTH_CALLBACK_BASE = "https://gameer.com.ar"

# D1 binding — fill in database_id after running `terraform apply` manually
# (see terraform/), then set via `cf d1` or by uncommenting below and redeploying.
# [[d1_databases]]
# binding = "DB"
# database_name = "gamer-hub-prod"
# database_id = "from-terraform-output"

# Secrets (JWT_SECRET, DISCORD_CLIENT_ID/SECRET, GOOGLE_CLIENT_ID/SECRET,
# FACEIT_API_KEY, RIOT_API_KEY) are set manually, not via wrangler.toml:
#   cf workers secrets put <NAME> --worker gamer-hub
