services:
  db:
    image: postgres:16-alpine
    container_name: gamer-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamer
      POSTGRES_PASSWORD: gamer
      POSTGRES_DB: gamer_hub
    ports:
      - "5433:5432"
    volumes:
      - gamer_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamer -d gamer_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API (NestJS, hot reload) ──────────────────────────────
  # `docker compose up` starts the whole stack; `up db` starts only Postgres.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: gamer-hub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://gamer:gamer@db:5432/gamer_hub?schema=public"
      API_PORT: "4000"
      WEB_ORIGIN: "http://localhost:3000"
      JWT_SECRET: "dev-only-change-me-please-32chars-min"
      LOG_FILE: "/app/logs/api.log"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - ./logs:/app/logs

  # ── Web (Next.js, Fast Refresh) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: gamer-hub-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  gamer_hub_pgdata:
  api_node_modules:
  web_node_modules:
