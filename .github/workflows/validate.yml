# Validation-only pipeline: lint, smoke tests, and build for both apps.
# Runs on pull requests only. Never deploys — Cloudflare Workers Builds deploys
# `gamer-hub` directly via its own GitHub integration, independently of this
# workflow (see hub/terraform/README.md). Every job is non-blocking
# (continue-on-error) so it never gates merging; branch protection on `main`
# only requires an approved PR, not these checks.
name: Validate

on:
  pull_request:
    branches: [main]

env:
  NODEJS_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gamer/api exec prisma generate

      - name: Build shared package
        run: pnpm --filter @gamer/shared build

      - name: Type check
        run: pnpm -r type-check

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gamer/api exec prisma generate

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run smoke tests
        run: pnpm --filter @gamer/web test
        env:
          PW_WEB_SERVER: "1"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gamer/api exec prisma generate

      - name: Build
        run: pnpm build

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gamer/api exec prisma generate

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://gameer.com.ar
