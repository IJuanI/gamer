name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'hub/apps/api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    paths:
      - 'hub/apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  GCP_PROJECT: unity-dummy
  GCP_REGION: us-central1
  SERVICE_NAME: gamer-hub-api
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: us-central1-docker.pkg.dev/unity-dummy/docker/gamer-hub-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          cache_dir: '/github/workspace/.gcloud-cache'

      - name: Configure Docker for Artifact Registry
        run: |
          echo $GCLOUD_PROJECT | gcloud auth configure-docker ${{ env.REGISTRY }} --quiet 2>/dev/null &
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "revision_tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "revision_tag=prod" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: hub/apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Clean old PR image tags
        if: github.event_name == 'pull_request'
        run: |
          # Delete old PR tags (keep only current PR)
          gcloud artifacts docker images list ${{ env.IMAGE_NAME }} --format='value(tags)' \
            --project=${{ env.GCP_PROJECT }} | grep -oE 'pr-[0-9]+' | sort -u | while read tag; do
            if [[ "$tag" != "pr-${{ github.event.pull_request.number }}" ]]; then
              gcloud artifacts docker images delete ${{ env.IMAGE_NAME }}:$tag \
                --project=${{ env.GCP_PROJECT }} --quiet || true
            fi
          done

      - name: Deploy to Cloud Run (PR - no traffic)
        if: github.event_name == 'pull_request'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            --region=${{ env.GCP_REGION }} \
            --no-traffic \
            --update-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=unity-dummy

      - name: Deploy to Cloud Run (Production - with traffic)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --update-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=unity-dummy

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const url = `https://${{ env.SERVICE_NAME }}-${{ env.GCP_REGION }}.run.app`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 API Deployed\n\nCloud Run Service:\n\`\`\`\n${url}\n\`\`\``
            });

  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          cache_dir: '/github/workspace/.gcloud-cache'

      - name: Delete ephemeral revision
        run: |
          gcloud run revisions delete pr-${{ github.event.pull_request.number }} \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --quiet || true

      - name: Delete ephemeral image tag
        run: |
          gcloud container images delete ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
            --quiet || true
