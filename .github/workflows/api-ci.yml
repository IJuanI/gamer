name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'hub/apps/api/**'
      - 'hub/packages/shared/**'
      - '.github/workflows/api-ci.yml'
      - 'hub/pnpm-lock.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hub/apps/api/**'
      - 'hub/packages/shared/**'
      - '.github/workflows/api-ci.yml'
      - 'hub/pnpm-lock.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @gamer/api type-check

      - name: Lint
        run: pnpm --filter @gamer/api lint

      - name: Build
        run: pnpm --filter @gamer/api build

      - name: Unit tests
        run: pnpm --filter @gamer/api test
        timeout-minutes: 5
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: test-project
          FIRESTORE_EMULATOR_HOST: localhost:8080

  smoke-tests:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: hub

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: hub/pnpm-lock.yaml

      - name: Install Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore Emulator
        run: firebase emulators:start --project=test-project --only=firestore &
        timeout-minutes: 2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: pnpm --filter @gamer/api test:e2e smoke.spec.ts
        timeout-minutes: 10
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: test-project
          FIRESTORE_EMULATOR_HOST: localhost:8080
          JWT_SECRET: test-secret-key-at-least-32-chars-long
          API_PORT: 4000
          DISCORD_CLIENT_ID: test
          DISCORD_CLIENT_SECRET: test
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          WEB_ORIGIN: http://localhost:3000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: hub/apps/api/test-results/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, smoke-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: hub

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: hub
          file: hub/apps/api/Dockerfile
          push: false
          tags: gamer-hub-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Backend Build Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Type checking: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Linting: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Build: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: Passed" >> $GITHUB_STEP_SUMMARY

  production-deployment-ready:
    runs-on: ubuntu-latest
    needs: [test, smoke-tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment Ready
        run: echo "✅ All tests passed - ready for production deployment"
