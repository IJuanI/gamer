name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'hub/apps/web/**'
      - 'hub/packages/shared/**'
      - '.github/workflows/web-ci.yml'
      - 'hub/pnpm-lock.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hub/apps/web/**'
      - 'hub/packages/shared/**'
      - '.github/workflows/web-ci.yml'
      - 'hub/pnpm-lock.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_HOME=$(pnpm store path)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('hub/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @gamer/web --filter @gamer/shared

      - name: Build shared package
        run: pnpm --filter @gamer/shared build

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: hub/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('hub/apps/web/package.json', 'hub/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: pnpm --filter @gamer/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://localhost:4000' }}

      - name: Build Cloudflare bundle
        run: pnpm --filter @gamer/web pages:build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://localhost:4000' }}

  smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_HOME=$(pnpm store path)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('hub/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @gamer/web --filter @gamer/shared

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('hub/apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm --filter @gamer/web exec playwright install

      - name: Run E2E smoke tests
        run: pnpm --filter @gamer/web test
        timeout-minutes: 10
        env:
          PW_WEB_SERVER: '1'
          NEXT_PUBLIC_API_URL: 'http://localhost:4000'

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hub/apps/web/test-results/
          retention-days: 7

  build-deployment:
    runs-on: ubuntu-latest
    needs: [test, smoke-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: hub

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_HOME=$(pnpm store path)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('hub/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @gamer/web --filter @gamer/shared

      - name: Build shared package
        run: pnpm --filter @gamer/shared build

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: hub/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('hub/apps/web/package.json', 'hub/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build for deployment
        run: pnpm --filter @gamer/web pages:build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Summary
        run: |
          echo "### Frontend Build Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Type checking: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Linting: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Build: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Smoke Tests: Passed" >> $GITHUB_STEP_SUMMARY
